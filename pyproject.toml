[project]
name = "ourgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "connectorx>=0.4.5",
    "falkordb>=1.6.1",
    "graphiti-core[falkordb]>=0.29.0",
    "openai>=2.33.0",
    "polars>=1.40.1",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "tenacity>=9.1.4",
    "typer>=0.25.1",
    "vnstock>=4.0.2",
]

[tool.ruff]
src = ["src"]
exclude = ["**/*.ipynb", ".venv", ".venv/**"]

# E501 is left out for now, though it might be beneficial in the future to reconsider it https://docs.astral.sh/ruff/rules/#E501.
[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN201", "D100", "D101", "D102", "D103", "D104", "D107", "D203", "D213", "E501", "ERA001", "PLC0415"]



[tool.ruff.lint.isort]
known-first-party = ["ourgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[project.scripts]
ourgraph = "ourgraph.cli:app"
